name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Documentation
        run: cargo doc --locked --all-features --no-deps

  tests:
    name: Tests (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: windows-latest
            rust: stable
          - os: macos-latest
            rust: stable
          - os: ubuntu-latest
            rust: 1.88.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Unit, preservation, CLI, and documentation tests
        run: cargo test --locked --all-targets --all-features
      - name: Documentation examples
        run: cargo test --locked --doc --all-features

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - name: Release build
        run: cargo build --locked --release --all-targets --all-features
      - name: Verify publishable package
        run: cargo package --locked
      - name: Verify registry publishing dry run
        run: cargo publish --locked --dry-run
      - name: Test extracted release package
        run: |
          for manifest in target/package/sheetpatch-*/Cargo.toml; do
            cargo test --locked --all-targets --all-features --manifest-path "$manifest"
            cargo test --locked --doc --all-features --manifest-path "$manifest"
          done
      - name: Install and inspect extracted release package
        run: |
          for manifest in target/package/sheetpatch-*/Cargo.toml; do
            cargo install --locked --path "${manifest%/Cargo.toml}" --root "$RUNNER_TEMP/sheetpatch-install"
          done
          "$RUNNER_TEMP/sheetpatch-install/bin/sheetpatch" --version
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          binary = Path(os.environ["RUNNER_TEMP"]) / "sheetpatch-install/bin/sheetpatch"
          fixture = Path("tests/fixtures/libreoffice.xlsx")
          def read(*arguments):
              return json.loads(subprocess.check_output([str(binary), *map(str, arguments)]))
          sheets = read("list", "--json", fixture)
          assert [sheet["name"] for sheet in sheets] == ["Data", "Notes"]
          cells = read("get", "--json", fixture, "Data", "a1", "D1", "XFD1048576")
          assert [cell["cell"] for cell in cells] == ["A1", "D1", "XFD1048576"]
          assert cells[0]["value"] == "Original text" and cells[0]["style_index"] == 1
          assert cells[1]["value"] == 25 and cells[1]["formula"] == "B1*2"
          assert cells[2]["type"] == "blank" and cells[2]["value"] is None
          checked = subprocess.run(
              [str(binary), "patch", "--check", str(fixture), "-"],
              input="Data\tA1\ttext\tValidated through installed CLI\n",
              text=True, capture_output=True, check=True,
          )
          assert checked.stdout == "Validated 1 patch row.\n" and not checked.stderr
          assert "--check" in subprocess.check_output([str(binary), "help", "patch"], text=True)
          PY

  interoperability:
    name: LibreOffice interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - name: Install independent spreadsheet application
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libreoffice-calc
      - name: Release CLI
        run: cargo build --locked --release
      - name: Export, edit, and reopen normal and compacted workbooks
        run: python3 scripts/check_interoperability.py --sheetpatch target/release/sheetpatch

  ci:
    name: CI
    if: ${{ always() }}
    needs: [quality, tests, package, interoperability]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every check to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.tests.result }}
          PACKAGE: ${{ needs.package.result }}
          INTEROPERABILITY: ${{ needs.interoperability.result }}
        run: |
          test "$QUALITY" = success
          test "$TESTS" = success
          test "$PACKAGE" = success
          test "$INTEROPERABILITY" = success
