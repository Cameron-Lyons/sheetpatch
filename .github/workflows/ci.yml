name: CI

on:
  # Review branches run through pull requests; pushes run only for the default
  # branch and release tags, so a pull-request push starts one run, not two.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # Weekly re-audit of the unchanged lockfile against new advisories.
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its superseded run. Every other run
  # has its own group, so main, tag, scheduled, and manual runs always complete.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  quality:
    name: Quality
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - name: Formatting
        run: cargo fmt --all -- --check
      # The Google Rust Style Guide's one-module-per-`use` import grouping and
      # macro-matcher formatting are unstable rustfmt options, so a pinned
      # nightly rustfmt checks them. Installing it leaves stable the default.
      - name: Import grouping (nightly rustfmt)
        run: |
          rustup toolchain install nightly-2026-10-22 --profile minimal --component rustfmt
          cargo +nightly-2026-10-22 fmt --all -- --check --config imports_granularity=Module,format_macro_matchers=true
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      # Lints cfg(windows) code, which the Linux pass above never compiles.
      - name: Clippy (Windows target)
        run: cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets --all-features -- -D warnings
      - name: Documentation
        run: cargo doc --locked --all-features --no-deps

  tests:
    name: Tests (${{ matrix.os }}, Rust ${{ matrix.rust }})
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: windows-latest
            rust: stable
          - os: macos-latest
            rust: stable
          - os: ubuntu-latest
            rust: 1.88.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Unit, preservation, CLI, and documentation tests
        run: cargo test --locked --all-targets --all-features
      # Another dependency can enable quick-xml's escape-html feature, which
      # makes its default entity resolver accept HTML entities. Parsing must
      # resolve only XML's own either way.
      - name: Unit tests with quick-xml's escape-html feature
        run: cargo test --locked --lib --features quick-xml/escape-html
      - name: Documentation examples
        run: cargo test --locked --doc --all-features

  package:
    name: Package
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Release build
        run: cargo build --locked --release --all-targets --all-features
      # One sample of the fast operations runs every benchmark correctness check
      # except the slow sequential-edit comparison; timings are not compared.
      - name: Benchmark correctness checks
        env:
          SHEETPATCH_BENCH_SAMPLES: "1"
          SHEETPATCH_BENCH_OPERATIONS: bulk_at,prepared_single_reads,shared_prepared_reads
        run: cargo bench --locked --bench editing
      - name: Verify publishable package
        run: cargo package --locked
      - name: Verify registry publishing dry run
        run: cargo publish --locked --dry-run
      - name: Test extracted release package
        run: |
          for manifest in target/package/sheetpatch-*/Cargo.toml; do
            cargo test --locked --all-targets --all-features --manifest-path "$manifest"
            cargo test --locked --doc --all-features --manifest-path "$manifest"
          done
      # The ignored test inspects the installed executable. The previous step
      # already compiled that test, so it runs without rebuilding.
      - name: Install and inspect extracted release package
        run: |
          for manifest in target/package/sheetpatch-*/Cargo.toml; do
            cargo install --locked --path "${manifest%/Cargo.toml}" --root "$RUNNER_TEMP/sheetpatch-install"
            SHEETPATCH_INSTALLED_BINARY="$RUNNER_TEMP/sheetpatch-install/bin/sheetpatch" \
              cargo test --locked --all-features --manifest-path "$manifest" --test installed_cli -- --ignored
          done

  interoperability:
    name: LibreOffice interoperability
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install independent spreadsheet application
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libreoffice-calc
      # The ignored test edits with the release CLI that --release builds.
      - name: Export, edit, and reopen normal and compacted workbooks
        run: cargo test --locked --release --test libreoffice -- --ignored

  advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit
      # Fails on vulnerable, unsound, or yanked locked dependencies; unmaintained
      # notices are reported as warnings.
      - name: Audit Cargo.lock against the RustSec advisory database
        run: cargo audit --deny unsound --deny yanked

  ci:
    name: CI
    if: ${{ always() }}
    needs: [quality, tests, package, interoperability, advisories]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every check to pass
        env:
          EVENT: ${{ github.event_name }}
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.tests.result }}
          PACKAGE: ${{ needs.package.result }}
          INTEROPERABILITY: ${{ needs.interoperability.result }}
          ADVISORIES: ${{ needs.advisories.result }}
        run: |
          test "$ADVISORIES" = success
          # Scheduled runs only re-audit dependencies; other jobs are skipped.
          if [ "$EVENT" = schedule ]; then
            exit 0
          fi
          test "$QUALITY" = success
          test "$TESTS" = success
          test "$PACKAGE" = success
          test "$INTEROPERABILITY" = success
